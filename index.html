<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AzorJoki Marketplace PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0a0f1f;
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#111a33;
  padding:20px;
  height:100vh;
  position:fixed;
  left:0;
  top:0;
}

.sidebar h2{
  color:#00d4ff;
}

.cat{
  padding:10px;
  margin:8px 0;
  background:#1a2444;
  border-radius:8px;
  cursor:pointer;
}

.cat:hover{
  background:#00d4ff;
  color:black;
}

/* MAIN */
.main{
  margin-left:240px;
  width:100%;
  padding:20px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.search{
  width:60%;
}

.search input{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
}

/* BUTTON */
.btn{
  padding:10px 12px;
  background:#00d4ff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:#151d36;
  padding:15px;
  border-radius:10px;
  transition:0.2s;
  cursor:pointer;
}

.card:hover{
  transform:scale(1.03);
}

.price{
  color:#00d4ff;
  font-weight:bold;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#1a2444;
  padding:20px;
  border-radius:10px;
  width:300px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>AzorJoki</h2>

  <div class="cat" onclick="filterCat('all')">🔥 Semua</div>
  <div class="cat" onclick="filterCat('rank')">🏆 Rank</div>
  <div class="cat" onclick="filterCat('boost')">⚡ Boost</div>
  <div class="cat" onclick="filterCat('other')">🎮 Lainnya</div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <input class="search" id="search" placeholder="Cari layanan...">
    <button class="btn" onclick="openAdd()">+ Tambah Produk</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- MODAL DETAIL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="mTitle"></h3>
    <p id="mPrice"></p>
    <p id="mDesc"></p>
    <button class="btn" onclick="closeModal()">Tutup</button>
  </div>
</div>

<!-- MODAL ADD -->
<div class="modal" id="addModal">
  <div class="modal-content">
    <h3>Tambah Produk</h3>
    <input id="name" placeholder="Nama" style="width:100%;margin:5px 0;">
    <input id="price" placeholder="Harga" style="width:100%;margin:5px 0;">
    <input id="desc" placeholder="Deskripsi" style="width:100%;margin:5px 0;">
    <select id="cat" style="width:100%;margin:5px 0;">
      <option value="rank">Rank</option>
      <option value="boost">Boost</option>
      <option value="other">Lainnya</option>
    </select>
    <button class="btn" onclick="addProduct()">Simpan</button>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem("produk")) || [
  {name:"Joki Mythic",price:"5K/Bintang",desc:"Push ke Mythic cepat",cat:"rank"},
  {name:"Joki Glory",price:"6K/Bintang",desc:"Push Mythical Glory",cat:"rank"},
  {name:"Win Rate Boost",price:"50K+",desc:"Naikkan win rate akun",cat:"boost"}
];

let currentCat = "all";

function render(){
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  let search = document.getElementById("search").value.toLowerCase();

  products.forEach((p,i)=>{
    if((currentCat=="all" || p.cat==currentCat) && p.name.toLowerCase().includes(search)){
      grid.innerHTML += `
      <div class="card" onclick="openModal(${i})">
        <h3>${p.name}</h3>
        <p class="price">${p.price}</p>
        <p>${p.desc}</p>
      </div>`;
    }
  });
}

function filterCat(cat){
  currentCat = cat;
  render();
}

document.getElementById("search").addEventListener("input",render);

function openModal(i){
  let p = products[i];
  document.getElementById("mTitle").innerText = p.name;
  document.getElementById("mPrice").innerText = p.price;
  document.getElementById("mDesc").innerText = p.desc;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function openAdd(){
  document.getElementById("addModal").style.display="flex";
}

function addProduct(){
  let p = {
    name:document.getElementById("name").value,
    price:document.getElementById("price").value,
    desc:document.getElementById("desc").value,
    cat:document.getElementById("cat").value
  };

  products.push(p);
  localStorage.setItem("produk",JSON.stringify(products));

  document.getElementById("addModal").style.display="none";
  render();
}

render();
</script>

</body>
</html>
